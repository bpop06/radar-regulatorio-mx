name: Manual CI fallback

# Optional diagnostic only. The required release gates are executed by the
# scheduled Codex task in a clean local clone and reported as commit statuses.
# Keeping this workflow manual prevents an unrelated GitHub billing lock from
# blocking a project that otherwise uses only free repository features.
# If invoked, it still uses only the standard public-repository runner.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce GitHub Free workflow contract
        run: scripts/verify_github_free.sh
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Validate schema v8 public cut and manifest
        run: |
          test -f docs/data/manifest.json
          python -m app.cli validate --input docs/data/publications.json --require-v8
      - name: Enforce production freshness
        if: >-
          github.ref == 'refs/heads/main' &&
          hashFiles('docs/data/manifest.json') != ''
        run: >-
          python -m app.cli validate --input docs/data/publications.json
          --require-v8 --max-age-hours 25
      - name: Validate calendars
        run: python -m app.cli validate-calendars --input docs/data/calendars.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: npm run test:e2e
