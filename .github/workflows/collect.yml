name: Shadow regulatory collection

# Manual diagnostic only. Production cuts are created by the single Codex
# project automation through branch codex/radar-daily and a pull request.
# This workflow never commits or pushes generated data.

on:
  workflow_dispatch:
    inputs:
      days:
        description: Lookback window in days
        required: false
        default: "31"

permissions:
  contents: read

concurrency:
  group: shadow-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Transactional dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Collect and validate without publishing
        env:
          LOCAL_TIMEZONE: America/Mexico_City
          REQUEST_TIMEOUT_SECONDS: "45"
          SOURCE_RETRIES: "3"
          SOURCE_RETRY_BACKOFF_SECONDS: "1.5"
        run: |
          python -m app.cli certify-sources --days "${{ inputs.days }}"
          python -m app.cli collect --days "${{ inputs.days }}" --dry-run
